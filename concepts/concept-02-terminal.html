<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ahmad@home:~ — Concept 02: Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* CONCEPT 02 — TERMINAL
   The home page is a shell session. It boots by typing a few commands for you
   (whoami, cat bio.txt, tree --today, ls), then hands you the prompt. Every
   section is reachable by typing. Amber phosphor on soot, not green-on-black:
   the cliché is the rut. */
:root{
  --bg:#141210; --panel:#1b1917; --fg:#e7dcc7; --dim:#8f8573; --amber:#f2a93b; --amber-dim:#b47a22;
  --green:#9fcf7a; --line:#2b2723; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:400 .95rem/1.6 var(--mono);min-height:100vh;padding:clamp(.8rem,3vw,2rem);-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#141210}
a{color:var(--amber);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--amber-dim)}
a:hover{text-decoration-color:var(--amber)}
a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* the screen: a soft vignette + faint scanlines, restrained enough to read through */
.screen{position:relative;max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 30px 60px -30px rgba(0,0,0,.9),0 2px 0 rgba(255,255,255,.03) inset;overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 0%,transparent 60%,rgba(0,0,0,.35))}
.bar{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-bottom:1px solid var(--line);color:var(--dim);font-size:.8rem}
.bar i{width:11px;height:11px;border-radius:50%;background:#3a352f;display:inline-block}
.bar i:first-child{background:#5a4a3a}
.bar span{margin-left:auto}
#out{padding:1.1rem 1.2rem 0;min-height:60vh;max-height:78vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#out::-webkit-scrollbar{width:8px}#out::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.line{white-space:pre-wrap;word-break:break-word}
.cmd{color:var(--fg)}
.prompt{color:var(--green)}
.prompt b{color:var(--amber);font-weight:500}
.dim{color:var(--dim)}
.hl{color:var(--amber)}
.block{margin:.3rem 0 .9rem;padding-left:1.2rem;border-left:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;column-gap:1.5rem}
.tree-out{display:grid;grid-template-columns:150px 1fr;gap:1.2rem;align-items:start;margin:.4rem 0 1rem}
.tree-out img{width:100%;display:block;border:1px solid var(--line);filter:sepia(.35) contrast(1.05);border-radius:4px;image-rendering:auto}
.tree-out p{margin-top:.4rem;max-width:62ch}
.tree-out h3{font-weight:500;color:var(--amber)}
.tree-out em{color:var(--dim);font-style:italic}
.ls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.2rem 2rem;margin:.2rem 0 .8rem}
.ls a{text-decoration:none;color:var(--fg)}
.ls a::before{content:"d  ";color:var(--dim)}
.ls a:hover{color:var(--amber)}
form{display:flex;gap:.6rem;padding:.6rem 1.2rem 1.1rem;align-items:baseline}
form label{color:var(--green);white-space:nowrap}form label b{color:var(--amber);font-weight:500}
input{flex:1;background:transparent;border:0;color:var(--fg);font:inherit;outline:none;caret-color:var(--amber);min-width:0}
input::placeholder{color:#5b5347}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--amber);vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{max-width:900px;margin:.8rem auto 0;color:var(--dim);font-size:.8rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hint kbd{border:1px solid var(--line);border-radius:3px;padding:0 .35em;color:var(--fg)}
@media (max-width:560px){.tree-out{grid-template-columns:1fr}.tree-out img{max-width:180px}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
</head>
<body>
<div class="screen">
  <div class="bar"><i></i><i></i><i></i><span>ahmad@home: ~</span></div>
  <div id="out" aria-live="polite"></div>
  <form id="f" autocomplete="off">
    <label for="in"><b>ahmad</b>@home:~$</label>
    <input id="in" type="text" placeholder="type help" aria-label="Command input" spellcheck="false">
  </form>
</div>
<p class="hint"><span>Try <kbd>tree</kbd> · <kbd>ls</kbd> · <kbd>open trails</kbd> · <kbd>socials</kbd> · <kbd>contact</kbd></span><span><kbd>↑</kbd> history · <kbd>tab</kbd> completes</span></p>

<script>
(function () {
  var out = document.getElementById('out');
  var form = document.getElementById('f');
  var input = document.getElementById('in');
  var history = [];
  var histIdx = -1;

  var PAGES = {
    trails:   { label: 'trail-journal/', href: '../trails.html',   desc: 'Notes from hikes worth remembering' },
    projects: { label: 'projects/',      href: '../projects.html', desc: 'Tech, mostly for fun' },
    writing:  { label: 'writing/',       href: '#',                desc: 'Essays and the occasional rant' }
  };
  var SOCIALS = [
    ['github',    'https://github.com/atobasei'],
    ['linkedin',  'https://www.linkedin.com/in/ahmad-tobasei-6745a3263/'],
    ['instagram', 'https://www.instagram.com/ahmadtobasei/'],
    ['substack',  'https://substack.com/@ahmad288961']
  ];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined) { n.textContent = text; }
    return n;
  }
  function print(node) { out.appendChild(node); out.scrollTop = out.scrollHeight; }
  function printLine(text, cls) { print(el('div', 'line ' + (cls || ''), text)); }
  function echoCmd(cmd) {
    var l = el('div', 'line');
    var p = el('span', 'prompt'); var b = el('b', null, 'ahmad'); p.appendChild(b); p.appendChild(document.createTextNode('@home:~$ '));
    l.appendChild(p); l.appendChild(el('span', 'cmd', cmd)); print(l);
  }

  var commands = {
    help: function () {
      var b = el('div', 'block');
      var kv = el('div', 'kv');
      var rows = [
        ['whoami', 'who is this'], ['cat bio.txt', 'a short bio'], ['tree', "today's tree"],
        ['ls', 'pages on this site'], ['open <page>', 'go there (trails, projects, writing)'],
        ['socials', 'where else to find me'], ['contact', 'email'], ['clear', 'wipe the screen']
      ];
      for (var i = 0; i < rows.length; i++) { kv.appendChild(el('span', 'hl', rows[i][0])); kv.appendChild(el('span', 'dim', rows[i][1])); }
      b.appendChild(kv); print(b);
    },
    whoami: function () { printLine('Ahmad Tobasei — CS grad, Knoxville, Tennessee. Software by weekday, trails by weekend.'); },
    cat: function (arg) {
      if (arg !== 'bio.txt') { printLine('cat: ' + (arg || '') + ': No such file', 'dim'); return; }
      var b = el('div', 'block');
      b.appendChild(el('p', null, "Hi, I'm Ahmad. This is my space to show a little bit about me, the things I enjoy and projects I work on. Read about the tree of the day, check out my trail journal, or feel free to reach out :)"));
      print(b);
    },
    tree: function () {
      var w = el('div', 'tree-out');
      var img = el('img'); img.src = '../images/trees/american-beech.jpg'; img.alt = 'American Beech trunk'; w.appendChild(img);
      var t = el('div');
      t.appendChild(el('div', 'dim', '# tree --today  ·  ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })));
      t.appendChild(el('h3', null, 'American Beech'));
      t.appendChild(el('em', null, 'Fagus grandifolia · Eastern U.S. and southeastern Canada'));
      t.appendChild(el('p', null, "Easy to recognize even from a distance — smooth, pale gray bark that stays smooth for the tree's whole life, unlike almost every other hardwood. Beeches hold onto their dried, papery leaves through much of winter, so a beech grove in January still looks half-dressed."));
      t.appendChild(el('p', null, 'That smooth bark is also why beech trees are the most carved-on trees in America — old initials can stay legible for decades.'));
      w.appendChild(t); print(w);
    },
    ls: function () {
      var g = el('div', 'ls');
      for (var k in PAGES) { var a = el('a', null, PAGES[k].label); a.href = PAGES[k].href; a.title = PAGES[k].desc; g.appendChild(a); }
      print(g);
    },
    open: function (arg) {
      var p = PAGES[arg];
      if (!p) { printLine('open: unknown page "' + (arg || '') + '". Try: trails, projects, writing', 'dim'); return; }
      printLine('opening ' + p.label + ' …', 'dim');
      if (p.href !== '#') { setTimeout(function () { window.location.href = p.href; }, 350); }
      else { printLine('(the writing page is coming soon)', 'dim'); }
    },
    socials: function () {
      var kv = el('div', 'kv block');
      for (var i = 0; i < SOCIALS.length; i++) {
        kv.appendChild(el('span', 'hl', SOCIALS[i][0]));
        var a = el('a', null, SOCIALS[i][1]); a.href = SOCIALS[i][1]; a.target = '_blank'; a.rel = 'noopener'; kv.appendChild(a);
      }
      print(kv);
    },
    contact: function () {
      var l = el('div', 'line'); l.appendChild(document.createTextNode('Best way is email → '));
      var a = el('a', null, 'ahmadtobasei123@gmail.com'); a.href = 'mailto:ahmadtobasei123@gmail.com'; l.appendChild(a); print(l);
    },
    clear: function () { out.innerHTML = ''; },
    pwd: function () { printLine('/home/ahmad'); },
    date: function () { printLine(new Date().toString()); },
    sudo: function () { printLine('nice try.', 'dim'); }
  };

  function run(raw) {
    var parts = raw.trim().split(/\s+/);
    var name = parts[0]; var arg = parts.slice(1).join(' ');
    if (!name) { return; }
    if (commands[name]) { commands[name](arg); }
    else { printLine(name + ': command not found. Type help.', 'dim'); }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value; if (!v.trim()) { return; }
    echoCmd(v); history.push(v); histIdx = history.length; input.value = ''; run(v);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--; input.value = history[histIdx]; } }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; } else { histIdx = history.length; input.value = ''; } }
    else if (e.key === 'Tab') {
      e.preventDefault(); var v = input.value; if (!v) { return; }
      for (var k in commands) { if (k.indexOf(v) === 0) { input.value = k + ' '; break; } }
    }
  });
  document.body.addEventListener('click', function (e) { if (e.target.tagName !== 'A' && !window.getSelection().toString()) { input.focus(); } });

  // Boot sequence: type a few commands so the page introduces itself.
  var boot = ['whoami', 'cat bio.txt', 'tree', 'ls'];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function typeCmd(cmd, done) {
    if (reduce) { echoCmd(cmd); run(cmd); done(); return; }
    var l = el('div', 'line');
    var p = el('span', 'prompt'); var b = el('b', null, 'ahmad'); p.appendChild(b); p.appendChild(document.createTextNode('@home:~$ '));
    var c = el('span', 'cmd', ''); var cur = el('span', 'cursor');
    l.appendChild(p); l.appendChild(c); l.appendChild(cur); print(l);
    var i = 0;
    (function tick() {
      if (i < cmd.length) { c.textContent += cmd[i++]; setTimeout(tick, 38 + Math.random() * 50); }
      else { setTimeout(function () { cur.remove(); run(cmd); done(); }, 220); }
    })();
  }
  input.disabled = true;
  (function next(i) {
    if (i >= boot.length) { input.disabled = false; input.focus(); return; }
    setTimeout(function () { typeCmd(boot[i], function () { next(i + 1); }); }, i === 0 ? 400 : 500);
  })(0);
})();
</script>
</body>
</html>
