<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Ahmad Tobasei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<!-- body class drives the current-page marker in the shared nav -->
<body class="page-projects">

<!-- Atmosphere: the site's ground texture. Present on every page. -->
<div class="air" aria-hidden="true">
  <span class="w1"></span><span class="w2"></span><span class="w3"></span><span class="w4"></span>
  <span class="band"></span>
</div>

<div class="page page--wide">

  <!-- ==========================================================================
       SHARED SITE HEADER — keep in sync across pages if edited.
       This exact block also appears in index.html and trails.html. It never
       needs to differ between pages: the current page is marked by the <body>
       class (page-home / page-trails / page-projects), not by editing here.
       ========================================================================== -->
  <header class="site-header">
    <a class="site-name" href="index.html">Ahmad Tobasei</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="trails.html">Trail reviews</a>
      <a href="projects.html">Projects</a>
    </nav>
  </header>
  <!-- ===================== end shared site header ===================== -->

  <main>

    <!-- ===== PAGE HEADING ===== -->
    <div class="page-head">
      <h1>Projects</h1>
      <!-- TODO: replace with a real intro if you want one -->
      <p class="lede">Things I've built, mostly for fun.</p>
    </div>

    <!-- ==========================================================================
         PROJECT CARD GRID
         Rendered by projects.js from the entries in projects-data.js — add new
         projects there, never here. The id must stay "project-grid": projects.js
         looks it up by that id. Cards share the trail-card treatment and stay
         deliberately flatter than the home page's tree-of-the-day centrepiece.
         ========================================================================== -->
    <div id="project-grid" class="card-grid">
      <!-- JS-rendered .project-card elements go here -->
    </div>

  </main>
</div>

<!-- Project data — edit this file to add or remove projects -->
<script src="projects-data.js"></script>
<!-- Renders the cards above from that data -->
<script src="projects.js"></script>
</body>
</html>
