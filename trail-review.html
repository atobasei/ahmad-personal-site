<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Generic on purpose: this one file serves every hike, so trail-review.js
       replaces this with the hike's name once it knows which one to render. -->
  <title>Trail Journal — Ahmad Tobasei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<!-- page-trails, not a page class of its own: a review IS part of the Trail
     Journal section, so the nav should mark Trail Journal as current here. -->
<body class="page-trails">

<!-- Atmosphere: the site's ground texture. Present on every page. -->
<div class="air" aria-hidden="true">
  <span class="w1"></span><span class="w2"></span><span class="w3"></span><span class="w4"></span>
  <span class="band"></span>
</div>

<div class="page">

  <!-- ==========================================================================
       SHARED SITE HEADER — keep in sync across pages if edited.
       This exact block also appears in index.html, trails.html and
       projects.html. It never needs to differ between pages: the current page
       is marked by the <body> class (page-home / page-trails / page-projects),
       not by editing here.
       ========================================================================== -->
  <header class="site-header">
    <a class="site-name" href="index.html">Ahmad Tobasei</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="trails.html">Trail Journal</a>
      <a href="projects.html">Projects</a>
    </nav>
  </header>
  <!-- ===================== end shared site header ===================== -->

  <main>

    <a class="back-link" href="trails.html">Trail Journal</a>

    <!-- ==========================================================================
         ONE PAGE, EVERY HIKE
         This file is a template. Which hike it shows comes from the query
         string, e.g.  trail-review.html?id=mount-leconte-via-alum-cave-trail
         — trail-review.js reads that id, finds the matching entry in
         trails-data.js and renders into the element below.

         So there is no per-hike HTML file to create: adding a hike means
         adding an object to trails-data.js and nothing else.

         The id must stay "trail-review": trail-review.js looks it up by it.
         ========================================================================== -->
    <article id="trail-review">
      <!-- JS-rendered. Falls back to a "not found" state when the id is
           missing or matches no entry. -->
    </article>

  </main>
</div>

<!-- Trail data — the same file the Trail Journal index reads -->
<script src="trails-data.js"></script>
<!-- Reads ?id= and renders the hike above -->
<script src="trail-review.js"></script>
</body>
</html>
