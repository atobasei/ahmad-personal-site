<!DOCTYPE html>
<html lang="en">
<head>

<body>

  <!-- ==========================================================================
       BACKDROP — full-viewport illustrated landscape, fixed behind the page and
       panned slowly on scroll (parallax, see trails.js). trails.html only; all
       markup/CSS is namespaced `trails-hero` so nothing leaks to index.html.
       The art is taller than the viewport, so you always see most of it.
       Colors live in the <defs> gradients below — tune them there.
       ========================================================================== -->
  <div class="trails-hero" aria-hidden="true">
    <!-- xMin (not xMid) keeps the left-hand massif on screen at every width —
         that dark shoulder is what the heading sits on for contrast. -->
    <svg class="trails-hero__art"
         viewBox="0 0 1200 660"
         preserveAspectRatio="xMinYMin slice"
         aria-hidden="true"
         focusable="false">
      <defs>
        <!-- Sky: warm yellow -> gold -> amber-coral -> hazy lavender-blue at the
             ridgeline. userSpaceOnUse so the gradient finishes by y=300, where
             the sky meets the ridges — below that it pads out to the haze. -->
        <linearGradient id="tr-sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="300">
          <stop offset="0"    stop-color="#fcdc85"/>
          <stop offset="0.14" stop-color="#f9cb76"/>
          <stop offset="0.30" stop-color="#f5b473"/>
          <stop offset="0.46" stop-color="#efa07c"/>
          <stop offset="0.62" stop-color="#e0968f"/>
          <stop offset="0.78" stop-color="#c39ab0"/>
          <stop offset="1"    stop-color="#9fa9c8"/>
        </linearGradient>

        <!-- Atmospheric perspective: back -> front the hue walks from pale
             lavender-blue to deep forest green, saturation up, lightness down.
             Each layer also lightens slightly at its crest (backlit haze). -->
        <linearGradient id="tr-ridge-1" gradientUnits="userSpaceOnUse" x1="0" y1="254" x2="0" y2="324">
          <stop offset="0" stop-color="#c9cbdf"/><stop offset="1" stop-color="#b4b9d3"/>
        </linearGradient>
        <linearGradient id="tr-ridge-2" gradientUnits="userSpaceOnUse" x1="0" y1="303" x2="0" y2="359">
          <stop offset="0" stop-color="#adb4cc"/><stop offset="1" stop-color="#959ebd"/>
        </linearGradient>
        <linearGradient id="tr-ridge-3" gradientUnits="userSpaceOnUse" x1="0" y1="323" x2="0" y2="380">
          <stop offset="0" stop-color="#8d99b0"/><stop offset="1" stop-color="#75849e"/>
        </linearGradient>
        <linearGradient id="tr-ridge-4" gradientUnits="userSpaceOnUse" x1="0" y1="345" x2="0" y2="415">
          <stop offset="0" stop-color="#678090"/><stop offset="1" stop-color="#4f6c7d"/>
        </linearGradient>
        <linearGradient id="tr-ridge-5" gradientUnits="userSpaceOnUse" x1="0" y1="368" x2="0" y2="452">
          <stop offset="0" stop-color="#456a5f"/><stop offset="1" stop-color="#315a4e"/>
        </linearGradient>
        <linearGradient id="tr-ridge-6" gradientUnits="userSpaceOnUse" x1="0" y1="390" x2="0" y2="536">
          <stop offset="0" stop-color="#2a4331"/><stop offset="1" stop-color="#16291c"/>
        </linearGradient>

      </defs>

      <rect width="1200" height="660" fill="url(#tr-sky)"/>

      <path fill="url(#tr-ridge-3)" d="M 0 325.6 C 6.0 326.3 38.0 329.5 50 331.2 C 62.0 332.9 88.0 337.2 100 339.6 C 112.0 342.0 138.0 348.1 150 350.8 C 162.0 353.5 188.0 359.6 200 362.0 C 212.0 364.4 238.0 369.1 250 370.4 C 262.0 371.7 288.0 373.5 300 373.2 C 312.0 372.9 338.0 368.6 350 367.6 C 362.0 366.6 388.0 364.8 400 364.8 C 412.0 364.8 438.0 366.8 450 367.6 C 462.0 368.4 488.0 371.8 500 371.8 C 512.0 371.8 538.0 368.6 550 367.6 C 562.0 366.6 588.0 363.4 600 363.4 C 612.0 363.4 638.0 366.4 650 367.6 C 662.0 368.8 688.0 372.9 700 373.2 C 712.0 373.5 738.0 371.7 750 370.4 C 762.0 369.1 788.0 363.7 800 362.0 C 812.0 360.3 838.0 356.4 850 356.4 C 862.0 356.4 888.0 360.3 900 362.0 C 912.0 363.7 938.0 368.6 950 370.4 C 962.0 372.2 988.0 377.1 1000 377.4 C 1012.0 377.7 1038.0 374.2 1050 373.2 C 1062.0 372.2 1088.0 369.7 1100 369.0 C 1112.0 368.3 1138.0 367.4 1150 367.6 C 1162.0 367.8 1194.0 370.1 1200 370.4 L 1200 660 L 0 660 Z"/>

      <!-- Ridge 5 — notch at x=180, long climb to a peak at x=704, then a
           second notch at x=904. Amplitude deliberately unlike its neighbors. -->
      <path fill="url(#tr-ridge-5)" d="M 0 370.4 C 6.0 371.7 38.0 378.6 50 381.6 C 62.0 384.6 88.0 391.9 100 395.6 C 112.0 399.3 138.0 408.4 150 412.4 C 162.0 416.4 188.0 425.8 200 429.2 C 212.0 432.6 238.0 438.4 250 440.4 C 262.0 442.4 288.0 445.7 300 446.0 C 312.0 446.3 338.0 444.5 350 443.2 C 362.0 441.9 388.0 436.8 400 434.8 C 412.0 432.8 438.0 428.1 450 426.4 C 462.0 424.7 488.0 420.8 500 420.8 C 512.0 420.8 538.0 424.7 550 426.4 C 562.0 428.1 588.0 432.8 600 434.8 C 612.0 436.8 638.0 442.7 650 443.2 C 662.0 443.7 688.0 440.7 700 439.0 C 712.0 437.3 738.0 431.7 750 429.2 C 762.0 426.7 788.0 420.4 800 418.0 C 812.0 415.6 838.0 409.6 850 409.6 C 862.0 409.6 888.0 415.6 900 418.0 C 912.0 420.4 938.0 426.5 950 429.2 C 962.0 431.9 988.0 438.0 1000 440.4 C 1012.0 442.8 1038.0 448.1 1050 448.8 C 1062.0 449.5 1088.0 446.7 1100 446.0 C 1112.0 445.3 1138.0 443.2 1150 443.2 C 1162.0 443.2 1194.0 445.7 1200 446.0 L 1200 660 L 0 660 Z"/>

      <!-- Ridge 6 — frontmost silhouette. Deep notch at x=494 where two flanks
           meet, dominant peak at x=684, ridge rising again around x=1000. -->
      <path fill="url(#tr-ridge-6)" d="M 0 392.8 C 6.0 394.5 38.0 403.1 50 406.8 C 62.0 410.5 88.0 419.2 100 423.6 C 112.0 428.0 138.0 438.8 150 443.2 C 162.0 447.6 188.0 456.3 200 460.0 C 212.0 463.7 238.0 471.0 250 474.0 C 262.0 477.0 288.0 482.5 300 485.2 C 312.0 487.9 338.0 496.1 350 496.4 C 362.0 496.7 388.0 487.7 400 488.0 C 412.0 488.3 438.0 497.2 450 499.2 C 462.0 501.2 488.0 503.5 500 504.8 C 512.0 506.1 538.0 509.2 550 510.4 C 562.0 511.6 588.0 513.6 600 514.6 C 612.0 515.6 638.0 517.8 650 518.8 C 662.0 519.8 688.0 522.2 700 523.0 C 712.0 523.8 738.0 525.3 750 525.8 C 762.0 526.3 788.0 526.9 800 527.2 C 812.0 527.5 838.0 528.3 850 528.6 C 862.0 528.9 888.0 529.8 900 530.0 C 912.0 530.2 938.0 530.2 950 530.0 C 962.0 529.8 988.0 528.9 1000 528.6 C 1012.0 528.3 1038.0 527.5 1050 527.2 C 1062.0 526.9 1088.0 526.1 1100 525.8 C 1112.0 525.5 1138.0 524.6 1150 524.4 C 1162.0 524.2 1194.0 524.4 1200 524.4 L 1200 660 L 0 660 Z"/>

    </svg>
  </div>

  <div class="page page--wide">

    <!-- Heading + back-link scroll normally over the fixed backdrop. The page's
         top padding drops them low in the first screen, onto the dark foreground
         ridge, so the cream text keeps its contrast. -->
    <header class="trails-intro">
      <a href="index.html" class="trails-intro__back">&larr; Home</a>
      <h1 class="trails-intro__title">Trail Reviews</h1>
      <!-- TODO: replace with real intro text if you want one -->
      <p class="trails-intro__lede">Notes from hikes worth remembering.</p>
    </header>

    <!-- ============ TRAIL CARD GRID ============ -->
    <!-- Cards are rendered from trails-data.js by trails.js — add new hikes there. -->
    <div id="trail-grid" class="trail-grid">
      <!-- JS-rendered .trail-card elements go here -->
    </div>

  </div>

  <!-- Placeholder trail data — edit this file to add/remove hikes -->
  <script src="trails-data.js"></script>
  <!-- Renders the cards above from the data -->
  <script src="trails.js"></script>
</body>
</html>
