<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail Journal — Ahmad Tobasei</title>
  <meta name="description" content="Notes from hikes worth remembering — what the trail felt like, not what it measured.">
  <link rel="canonical" href="https://atobasei.github.io/ahmad-personal-site/trails.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Link preview. The site’s main entry point is a URL pasted into a job
       application or a message, so these decide what that paste looks like.
       og:image must be an ABSOLUTE url — relative paths are ignored by most
       scrapers. Update the base url here if the site ever moves domain. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ahmad Tobasei">
  <meta property="og:title" content="Trail Journal — Ahmad Tobasei">
  <meta property="og:description" content="Notes from hikes worth remembering — what the trail felt like, not what it measured.">
  <meta property="og:url" content="https://atobasei.github.io/ahmad-personal-site/trails.html">
  <meta property="og:image" content="https://atobasei.github.io/ahmad-personal-site/images/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<!-- body class drives the current-page marker in the shared nav -->
<body class="page-trails">

<!-- Atmosphere: the site's ground texture. Present on every page. -->
<div class="air" aria-hidden="true">
  <span class="w1"></span><span class="w2"></span><span class="w3"></span><span class="w4"></span>
  <span class="band"></span>
</div>

<div class="page page--wide">

  <!-- ==========================================================================
       SHARED SITE HEADER — keep in sync across pages if edited.
       This exact block also appears in index.html and projects.html. It never
       needs to differ between pages: the current page is marked by the <body>
       class (page-home / page-trails / page-projects), not by editing here.
       ========================================================================== -->
  <header class="site-header">
    <a class="site-name" href="index.html">Ahmad Tobasei</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="trails.html">Trail Journal</a>
      <a href="projects.html">Projects</a>
    </nav>
  </header>
  <!-- ===================== end shared site header ===================== -->

  <main>

    <!-- ===== PAGE HEADING ===== -->
    <div class="page-head">
      <h1>Trail Journal</h1>
      <!-- TODO: replace with a real intro if you want one -->
      <p class="lede">My virtual trail journal; some notes and takeaways about my experiences on different hikes.</p>
    </div>

    <!-- ==========================================================================
         TRAIL LIST
         Rendered by trails.js from the entries in trails-data.js — add new hikes
         there, never here. The id must stay "trail-grid": trails.js looks it up
         by that id (kept as-is so no existing script breaks, even though the
         layout is now a single-column list of rows rather than a grid). Row
         markup and class names come from trails.js too.
         ========================================================================== -->
    <div id="trail-grid" class="trail-list">
      <!-- JS-rendered .trail-row elements go here -->
    </div>

  </main>
</div>

<!-- Trail data — edit this file to add or remove hikes -->
<script src="trails-data.js"></script>
<!-- Renders the rows above from that data -->
<script src="trails.js"></script>
</body>
</html>
